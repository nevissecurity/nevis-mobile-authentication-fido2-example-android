name: Main Branch Commit

on:
  push:
    branches: [ 'main' ]
  schedule:
    # At 6:00 am on the 1st and 15th day of the month (every two weeks)
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    HOST_NAME: ${{ secrets.HOST_NAME }}
    BACKEND_ACCESS_TOKEN: ${{ secrets.BACKEND_ACCESS_TOKEN }}
    SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    CURRENT_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    RUBY_VERSION: ${{ vars.RUBY_VERSION }}
    JAVA_VERSION: ${{ vars.JAVA_VERSION }}

jobs:
  get-version-number:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version-number: ${{ steps.get_version.outputs.version-number }}
      build-number: ${{ steps.get_version.outputs.build-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        uses: ./.github/actions/get-version

  build-and-distribute:
    name: Build and Distribute
    needs: [get-version-number]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-android

      - name: Cache RubyGem Dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Run Fastlane
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: 'main'
          options: |
              {
                "build_number": "${{ needs.get-version-number.outputs.build-number }}",
                "version_number": "${{ needs.get-version-number.outputs.version-number }}",
                "host_name": "${{ env.HOST_NAME }}",
                "backend_access_token": "${{ env.BACKEND_ACCESS_TOKEN }}"
              }

  create-tag:
    name: Create Tag
    needs: [get-version-number, build-and-distribute]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Tag
        uses: ./.github/actions/create-tag
        with:
          build-category: 'release'
          app-version: ${{ needs.get-version-number.outputs.version-number }}
          build-number: ${{ needs.get-version-number.outputs.build-number }}
