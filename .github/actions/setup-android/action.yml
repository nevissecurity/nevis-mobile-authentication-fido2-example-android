name: Setup Android
description: Setup Android resources and install dependencies

runs:
    using: composite
    steps:
        - name: Install JDK
          uses: actions/setup-java@v4
          with:
              distribution: 'zulu'
              java-version: ${{ env.JAVA_VERSION }}

        - name: Cache RubyGem Dependencies
          uses: ruby/setup-ruby@v1
          with:
              ruby-version: ${{ env.RUBY_VERSION }}
              bundler-cache: true

        - name: Decode Keystore
          if: ${{ github.workflow == 'Main Branch Commit' }}
          uses: timheuer/base64-to-file@v1
          with:
              fileName: 'keystore-fido2-example-app-android-dev.jks'
              fileDir: './etc'
              encodedString: ${{ env.KEYSTORE_FILE }}

        - name: Cache Gradle
          uses: actions/cache@v4
          with:
              path: |
                  ~/.gradle/wrapper
                  ~/.gradle/caches
              key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
